# Runtime only. Relative paths resolve beside this file.
model_dir: /home/cnic/piflow/piflow/scientific_agents/models/timesfm
data_registry: sources.yaml
# 项目研究关注标准；设为 null 可停用。不是官方灾害预警信号。
risk_standard: forecast_risk_standard.yaml
cpu_threads: 4
frequency_minutes: 60
context_steps: 168
# 默认历史点数=max(context_steps, 预测点数*history_multiplier)。不足时仅回退到context_steps。
history_multiplier: 7
# 支持 1 至该上限的任意整数小时；7 天 = 168 小时。
max_horizon_hours: 168
max_cases: 3
max_missing_fraction: 0.02
forward_fill_limit: 1
execution:
  queue_seconds: 300
  task_seconds: 600
  stage_seconds: 180
  cancel_grace_seconds: 15
root: workspace/forecast_extension
