- id: ST001-CAMPBELL-B001
  kind: campbell_jsonl
  version: v1
  license: 用户提供的台站数据；授权范围待数据提供方确认
  citation: ST001-CAMPBELL-B001 台站实时观测；本地目录 /mnt/corpus/corpus/ST001-CAMPBELL-B001
  options:
    # 服务部署在数据所在服务器，直接只读访问本地目录。
    register_all_variables: true
    case_prefix: campbell_b001
    bridge_delayed_observations: true
    directory: /mnt/corpus/corpus/ST001-CAMPBELL-B001
    scan_interval_seconds: 60
    # 并发扫描时等待本地缓存数据库锁的上限。
    timeout_seconds: 20
  cases:
  - id: campbell_b001_rainfall
    label: ST001-CAMPBELL-B001 · 降雨量
    station_id: ST001-CAMPBELL-B001
    analysis_context:
      domain: 台站气象观测
      subject: ST001-CAMPBELL-B001 台站半小时降雨量
      objective: 结合历史气象辅助变量预测降雨量，分析降雨集中时段和潜在影响。
      background: >-
        台站地址见 sources.yaml 的 location。单位和 Asia/Shanghai 时区为接入暂定约定，
        rain_Tot 暂按截至 timestamp 的前30分钟降雨量（mm）解释，待台站确认。
        辅助变量只有历史观测，不包含未来气象预报。短期样本不能证明极端降雨预测能力。
        不将降雨指标直接等同于洪水、滑坡或泥石流发生概率。
    target:
      name: rainfall_amount
      aliases: *rainfall_aliases
      description: rain_Tot；暂按每半小时降雨量处理，时间戳为区间结束时间，单位待确认。
      value_column: rain_Tot
      unit: mm
      timezone: Asia/Shanghai
      aggregation: sum
      minimum: 0
      attention: high
    covariates:
    - name: air_temperature
      value_column: TA_Avg
      unit: °C
      timezone: Asia/Shanghai
      aggregation: mean
    - name: relative_humidity
      value_column: RH_Avg
      unit: '%'
      timezone: Asia/Shanghai
      aggregation: mean
      minimum: 0
      maximum: 100
    - name: air_pressure
      value_column: BP_Avg
      unit: hPa
      timezone: Asia/Shanghai
      aggregation: mean
      minimum: 0
    - name: wind_speed
      value_column: WS_Avg
      unit: m/s
      timezone: Asia/Shanghai
      aggregation: mean
      minimum: 0
    - name: wind_direction
      value_column: WD_Avg
      unit: °
      timezone: Asia/Shanghai
      aggregation: mean
      semantics: circular_degrees
      minimum: 0
      maximum: 360
scenarios:
- case_id: campbell_b001_rainfall
  version: campbell-live-1
  area: ST001-CAMPBELL-B001台站（位置待确认）
  hazard_type: rainfall
  aliases: [ST001-CAMPBELL-B001, CAMPBELL-B001, Campbell台站]
  hazard_aliases: [降雨, 降水, 雨量, 降雨量]
  mode: current
  frequency_minutes: 30
  context_steps: 336
  # 预测跨度不足24小时：允许前6小时；24小时及以上：允许前48小时。
  # max_data_age_minutes 非空时作为固定上限，优先于以下两项。
  max_data_age_minutes: 10080
  hourly_max_data_age_minutes: 360
  daily_max_data_age_minutes: 2880
  # 单位和累计口径未获数据方确认前，不自动套用毫米降雨风险阈值。
  # 确认 target 的单位/时间戳口径后可设为 true，复用 SRA-1.0。
  use_standard: false
